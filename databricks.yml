bundle:
  name: railpulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Existing Unity Catalog catalog used by RailPulse resources.
    default: workspace
  bronze_schema:
    description: Schema reserved for source-aligned RailPulse tables.
    default: railpulse_bronze
  silver_schema:
    description: Schema reserved for validated RailPulse tables.
    default: railpulse_silver
  gold_schema:
    description: Schema reserved for decision-support RailPulse tables.
    default: railpulse_gold

artifacts:
  default:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
    dynamic_version: true

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
