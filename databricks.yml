bundle:
  name: railpulse

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
    dynamic_version: true

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
