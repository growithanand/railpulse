resources:
  jobs:
    preflight:
      name: railpulse-preflight
      description: Verify the packaged RailPulse code and Spark runtime without writing data.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: runtime_preflight
          environment_key: default
          python_wheel_task:
            package_name: railpulse
            entry_point: databricks_preflight
            named_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
