resources:
  jobs:
    gold_cycle_processing:
      name: railpulse-gold-cycle-processing
      description: Refresh managed Silver, then derive and reconcile managed Gold loaded cycles.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: refresh_silver
          run_job_task:
            job_id: ${resources.jobs.silver_processing.id}
        - task_key: process_gold_loaded_cycles
          depends_on:
            - task_key: refresh_silver
          run_if: ALL_SUCCESS
          environment_key: default
          python_wheel_task:
            package_name: railpulse
            entry_point: databricks_gold_cycle_processing
            named_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
