resources:
  jobs:
    gold_failure_horizon_processing:
      name: railpulse-gold-failure-horizon-processing
      description: Refresh managed loaded cycles, then derive and reconcile two-hour failure horizons.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: refresh_loaded_cycles
          run_job_task:
            job_id: ${resources.jobs.gold_cycle_processing.id}
        - task_key: process_gold_failure_horizons
          depends_on:
            - task_key: refresh_loaded_cycles
          run_if: ALL_SUCCESS
          environment_key: default
          python_wheel_task:
            package_name: railpulse
            entry_point: databricks_gold_failure_horizon_processing
            named_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
